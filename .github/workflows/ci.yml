name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  tests:
    name: Docker tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build test image
        run: docker build -t synapseitu-tests .

      - name: Run tests
        run: docker run --rm synapseitu-tests