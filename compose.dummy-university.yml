# Local integration demo for WBS-13.1. Staging deployment is handled by WBS-14.6.
# Run: docker compose -f compose.dummy-university.yml up --build
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"

  dummy-university:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - /app/backend/.venv/bin/uvicorn
      - app.dummy_university.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8001:8000"
